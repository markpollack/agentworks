name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bom-verification:
    name: BOM verification (9/9)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Test stable-release SNAPSHOT guard
        run: ./scripts/test-release-guard
      - name: Verify current BOM
        run: ./scripts/verify-bom
