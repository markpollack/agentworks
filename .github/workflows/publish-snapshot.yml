name: Publish development BOM snapshot

# Every push to main publishes the development BOM snapshot; provenance is the main commit.
# Verification runs before deployment, and the published POM is re-verified from an empty repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-bom-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Verify from an empty Maven repository
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/pre-publish-m2
        run: |
          ./scripts/test-release-guard
          python3 -m unittest discover -s scripts/tests -v
          ./scripts/verify-bom
      - name: Publish only the BOM
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/pre-publish-m2
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          set -euo pipefail
          ./mvnw -B -N deploy | tee "$RUNNER_TEMP/bom-deploy.log"
      - name: Verify the published BOM and consumers from another empty repository
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/post-publish-m2
        run: |
          python3 scripts/verify-published-development-bom.py --output "$RUNNER_TEMP/published-bom.json" \
            --deploy-log "$RUNNER_TEMP/bom-deploy.log"
          VERSION=$(./mvnw -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          ./mvnw -B -U -f bom-verification/pom.xml verify -Dagentworks-bom.version="$VERSION"
      - name: Preserve publication proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-bom-proof
          path: |
            ${{ runner.temp }}/published-bom.json
            ${{ runner.temp }}/bom-deploy.log
            bom-verification/*/target/surefire-reports/*
